<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador Rayostats</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #ffffff;
      --text-muted: #b0b0b0;
      --accent: #e50914;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    input[type="text"] {
      padding: 10px;
      width: 60%;
      max-width: 400px;
      border-radius: 5px;
      border: 1px solid #444;
      background-color: #222;
      color: #fff;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin-left: 5px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
    .card-content {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card h3 {
      margin: 0 0 10px 0;
      font-size: 18px;
    }
    .card h4 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: var(--text-muted);
    }
    .card p {
      font-size: 13px;
      color: var(--text-muted);
      flex-grow: 1;
    }
    .card a {
      margin-top: 10px;
      color: var(--accent);
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>Rayostats</h1>
    <div style="margin-top: 15px;">
      <input type="text" id="termino" placeholder="Buscar publicaciones...">
      <button onclick="ejecutarBusqueda()">Buscar</button>
    </div>
  </header>

  <main id="portal-noticias" class="grid">
    <!-- Los resultados se cargan aquí -->
  </main>

  <script>
    var URL_API = "https://script.google.com/macros/s/AKfycbwM0OxUknn5qdJWA1NAkY5l_IPz-xybfdZLXYkBAihnB8wBD6ra5jjP4anTzPNt6lhuOA/exec";

    window.onload = function() {
      cargarPortadaInicial();
    };

    document.getElementById('termino').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        ejecutarBusqueda();
      }
    });

    function cargarPortadaInicial() {
      var contenedor = document.getElementById('portal-noticias');
      contenedor.innerHTML = '<p style="text-align:center;grid-column: 1/-1;color:var(--text-muted);">Cargando contenido...</p>';
      
      fetch(URL_API + "?v=buscar&q=")
        .then(response => response.json())
        .then(data => mostrarResultados(data))
        .catch(error => {
          contenedor.innerHTML = '<p style="text-align:center;grid-column: 1/-1;color:red;">Error al conectar con la base de datos.</p>';
        });
    }

    function ejecutarBusqueda() {
      var termino = document.getElementById('termino').value;
      var contenedor = document.getElementById('portal-noticias');
      contenedor.innerHTML = '<p style="text-align:center;grid-column: 1/-1;color:var(--text-muted);">Buscando...</p>';
      
      fetch(URL_API + "?v=buscar&q=" + encodeURIComponent(termino))
        .then(response => response.json())
        .then(data => mostrarResultados(data))
        .catch(error => {
          contenedor.innerHTML = '<p style="text-align:center;grid-column: 1/-1;color:red;">Error en la búsqueda.</p>';
        });
    }

    function mostrarResultados(posts) {
      var contenedor = document.getElementById('portal-noticias');
      contenedor.innerHTML = "";

      if (!posts || posts.length === 0) {
        contenedor.innerHTML = '<p style="text-align:center;grid-column: 1/-1;color:var(--text-muted);">No se encontraron publicaciones.</p>';
        return;
      }

      posts.forEach(post => {
        var card = document.createElement('div');
        card.className = 'card';

        var imgHtml = (post.foto && post.foto !== "NO_IMAGE") 
          ? `<img src="${post.foto}" alt="Imagen">` 
          : '';

        card.innerHTML = `
          ${imgHtml}
          <div class="card-content">
            <h3>${post.titular || ''}</h3>
            <h4>${post.subtitulo || ''}</h4>
            <p>${post.texto ? post.texto.substring(0, 100) + '...' : ''}</p>
            ${post.url && post.url !== '#' ? `<a href="${post.url}" target="_blank">Ver publicación &rarr;</a>` : ''}
          </div>
        `;
        contenedor.appendChild(card);
      });
    }
  </script>
</body>
</html>
