<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <base target="_top">
  <title>Rayostats - Portal Oficial</title>
  <style>
    /* =========================================================
        VARIABLES
    ========================================================= */
    :root {
      --bg-main: #f4f6f9;
      --bg-card: rgba(255, 255, 255, 0.95);
      --bg-card-hover: rgba(240, 242, 245, 1);
      --border-color: #ffffff;
      --color-rayo: #d0111a;
      --color-rayo-hover: #a80d14;
      --text-main: #111318;
      --text-muted: #5c6470;
    }
    /* =========================================================
        RESET & PANTALLA
    ========================================================= */
    * {
      box-sizing: border-box;
    }
    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family:
        "Segoe UI",
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body {
      padding: 20px 15px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    /* =========================================================
        CABECERA
    ========================================================= */
    .header-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid var(--border-color);
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }
    .header-titles h2 {
      margin: 0 0 4px 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .header-titles h2 span {
      color: var(--color-rayo);
    }
    .header-titles .subtitle {
      color: var(--text-muted);
      margin: 0;
      font-size: 13px;
      font-family: "Verdana", sans-serif;
    }
    /* =========================================================
        BUSCADOR
    ========================================================= */
    .search-box {
      display: flex;
      gap: 8px;
      background: rgba(0, 0, 0, 0.04);
      padding: 4px;
      border-radius: 10px;
      border: 2px solid var(--border-color);
      min-width: 300px;
    }
    .search-box input {
      flex: 1;
      padding: 10px 14px;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      font-family: "Verdana", sans-serif;
      width: 100%;
    }
    .search-box button {
      padding: 10px 20px;
      background-color: var(--color-rayo);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .search-box button:hover {
      background-color: var(--color-rayo-hover);
    }
    /* =========================================================
        SECCIÓN TITULARES
    ========================================================= */
    .seccion-titulares {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: 25px;
      margin-bottom: 35px;
      align-items: stretch;
    }
    /* =========================================================
        GRAN PORTADA
    ========================================================= */
    .post-gran-portada {
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      width: 100%;
      cursor: pointer;
    }
    .post-gran-portada .bg-image-wrapper {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }
    .post-gran-portada .bg-image-wrapper img,
    .post-gran-portada .bg-image-wrapper .placeholder-premium {
      width: 100%;
      aspect-ratio: 1080 / 1350;
      object-fit: cover !important;
      display: block;
    }
    .post-gran-portada .post-content {
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }
    .post-gran-portada h1 {
      font-size: 18px;
      font-weight: 800;
      margin: 0 0 15px 0;
      line-height: 1.4;
      color: var(--text-main);
      font-family: "Verdana", sans-serif;
    }
    /* =========================================================
        TITULARES SECUNDARIOS
    ========================================================= */
    .columna-titulares-secundarios {
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: 100%;
    }
    .tarjeta-titular-mini {
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
      width: 100%;
      cursor: pointer;
      flex: 1;
    }
    .tarjeta-titular-mini .img-side-container {
      width: 100%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tarjeta-titular-mini .img-side,
    .tarjeta-titular-mini .img-side-container .placeholder-premium {
      width: 100%;
      height: auto;
      aspect-ratio: 1080 / 1350;
      object-fit: cover !important;
      display: block;
    }
    .tarjeta-titular-mini .content-side {
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      flex: 1;
    }
    .tarjeta-titular-mini h3 {
      font-size: 13px;
      font-weight: 700;
      margin: 0;
      line-height: 1.4;
      color: var(--text-main);
      font-family: "Verdana", sans-serif;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    /* =========================================================
        WIDGET LATERAL
    ========================================================= */
    .columna-widget-lateral {
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    .widget-header-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--color-rayo);
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--color-rayo);
      font-family: "Segoe UI", sans-serif;
    }
    .widget-iframe-container {
      flex: 1;
      width: 100%;
      min-height: 600px;
      overflow: hidden;
      border-radius: 10px;
      position: relative;
    }
    /* =========================================================
        PARRILLA INFERIOR
    ========================================================= */
    .col-titulo {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--color-rayo);
      margin: 30px 0 25px 0;
      text-transform: uppercase;
      border-bottom: 2px solid var(--color-rayo);
      padding-bottom: 6px;
      font-family: "Segoe UI", sans-serif;
    }
    .parrilla-analisis-feed {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      border-top: 2px solid var(--border-color);
      padding-top: 30px;
    }
    .card-analisis-feed {
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
      width: 100%;
      cursor: pointer;
    }
    .card-analisis-feed:hover {
      background: var(--bg-card-hover);
    }
    .card-analisis-feed .img-container {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }
    .card-analisis-feed .img-container img,
    .card-analisis-feed .img-container .placeholder-premium {
      width: 100%;
      aspect-ratio: 1080 / 1350;
      object-fit: cover !important;
      display: block;
    }
    .card-analisis-feed .content {
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      flex: 1;
    }
    /* =========================================================
        ELEMENTOS AUXILIARES
    ========================================================= */
    .badge-live {
      background: var(--color-rayo);
      color: white;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      margin-right: 8px;
      display: inline-block;
      vertical-align: middle;
      font-family: "Segoe UI", sans-serif;
    }
    .post-link-btn {
      display: inline-block;
      font-size: 11px;
      color: white;
      background: var(--color-rayo);
      border: 1px solid var(--color-rayo);
      padding: 5px 10px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
      font-family: "Segoe UI", sans-serif;
      align-self: flex-start;
      margin-top: 10px;
    }
    .post-link-btn:hover {
      background: var(--color-rayo-hover);
    }
    .ver-link {
      color: var(--color-rayo);
      font-size: 11px;
      text-decoration: none;
      font-weight: bold;
      font-family: "Segoe UI", sans-serif;
      align-self: flex-start;
    }
    .placeholder-premium {
      background: linear-gradient(135deg, #f0f2f5 0%, #e4e7eb 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
    }
    /* =========================================================
        MODAL
    ========================================================= */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 20, 30, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 999;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-box {
      background: #ffffff;
      border: 2px solid #ffffff;
      width: 95%;
      max-width: 1200px;
      height: 85vh;
      border-radius: 20px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
      position: relative;
      animation: modalEntrada 0.25s ease-out;
    }
    @keyframes modalEntrada {
      from {
        transform: scale(0.95);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }
    /* =========================================================
        CONTENEDOR DE IMAGEN DEL MODAL
    ========================================================= */
    .modal-img-container {
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .slider-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }
    .slide-item {
      min-width: 100%;
      max-width: 100%;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-sizing: border-box;
      background: #ffffff;
    }
    .slide-item img {
      width: 100%;
      height: 100%;
      max-height: 85vh;
      object-fit: contain !important;
      display: block;
      background: #ffffff;
    }
    /* =========================================================
        BOTONES CARRUSEL
    ========================================================= */
    .carrusel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(0, 0, 0, 0.15);
      color: #111318;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
    }
    .carrusel-btn:hover {
      background: var(--color-rayo);
      border-color: var(--color-rayo);
      color: white;
    }
    .carrusel-btn.prev {
      left: 12px;
    }
    .carrusel-btn.next {
      right: 12px;
    }
    /* =========================================================
        INDICADORES
    ========================================================= */
    .carrusel-indicadores {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 20;
      background: rgba(255, 255, 255, 0.85);
      padding: 5px 10px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .indicador-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.2);
      transition: 0.2s;
    }
    .indicador-dot.activo {
      background: var(--color-rayo);
      transform: scale(1.2);
    }
    /* =========================================================
        TEXTO DEL MODAL
    ========================================================= */
    .modal-body-content {
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
      height: 100%;
      max-height: 85vh;
      background: #ffffff;
    }
    .modal-text {
      font-family: "Verdana", sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #2d3748;
      white-space: pre-line;
      margin-bottom: 20px;
    }
    /* =========================================================
        BOTÓN CERRAR
    ========================================================= */
    .modal-close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(0, 0, 0, 0.12);
      color: #111318;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1001;
      transition: 0.2s;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
    }
    .modal-close-btn:hover {
      background: var(--color-rayo);
      border-color: var(--color-rayo);
      color: white;
    }
    /* =========================================================
        FOOTER MODAL
    ========================================================= */
    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      padding-top: 15px;
    }
    /* =========================================================
        MÓVIL
    ========================================================= */
    @media screen and (max-width: 900px) {
      body {
        padding: 10px 8px !important;
      }
      .container {
        width: 100% !important;
        max-width: 100% !important;
      }
      .header-card {
        flex-direction: column !important;
        align-items: stretch !important;
        text-align: center !important;
        padding: 18px 15px !important;
        margin-bottom: 20px !important;
      }
      .search-box {
        min-width: 100% !important;
        width: 100% !important;
      }
      .seccion-titulares {
        display: flex !important;
        flex-direction: column !important;
        width: 100% !important;
        gap: 20px !important;
      }
      .columna-titulares-secundarios {
        width: 100% !important;
      }
      .columna-widget-lateral {
        width: 100% !important;
        min-height: 600px !important;
      }
      .tarjeta-titular-mini {
        flex-direction: column !important;
        width: 100% !important;
      }
      .tarjeta-titular-mini .img-side-container {
        width: 100% !important;
        background: #ffffff !important;
      }
      .tarjeta-titular-mini .img-side {
        aspect-ratio: 1080 / 1350 !important;
        width: 100% !important;
        height: auto !important;
        object-fit: cover !important;
      }
      .modal-overlay {
        padding: 8px !important;
        align-items: center !important;
      }
      .modal-box {
        display: flex !important;
        flex-direction: column !important;
        width: 100% !important;
        max-width: 100% !important;
        height: 94vh !important;
        max-height: 94vh !important;
        border-radius: 18px !important;
        overflow: hidden !important;
        background: #ffffff !important;
      }
      .modal-img-container {
        width: 100% !important;
        height: 68% !important;
        min-height: 68% !important;
        max-height: 68% !important;
        flex: 0 0 68% !important;
        background: #ffffff !important;
        overflow: hidden !important;
      }
      .slider-track {
        width: 100% !important;
        height: 100% !important;
      }
      .slide-item {
        width: 100% !important;
        min-width: 100% !important;
        max-width: 100% !important;
        height: 100% !important;
        background: #ffffff !important;
      }
      .slide-item img {
        width: 100% !important;
        height: 100% !important;
        max-width: 100% !important;
        max-height: 100% !important;
        object-fit: contain !important;
        background: #ffffff !important;
        display: block !important;
      }
      .modal-close-btn {
        top: 10px !important;
        right: 10px !important;
        width: 40px !important;
        height: 40px !important;

        z-index: 1005 !important;
      }
      .carrusel-btn {
        width: 36px !important;
        height: 36px !important;
        font-size: 14px !important;
        z-index: 100 !important;
        background: rgba(255,255,255,0.92) !important;
      }
      .carrusel-btn.prev {
        left: 8px !important;
      }
      .carrusel-btn.next {
        right: 8px !important;
      }
      .carrusel-indicadores {
        bottom: 8px !important;
        padding: 4px 8px !important;
        gap: 5px !important;
      }
      .indicador-dot {
        width: 6px !important;
        height: 6px !important;
      }
      .modal-body-content {
        width: 100% !important;
        height: 32% !important;
        min-height: 32% !important;
        max-height: 32% !important;
        flex: 0 0 32% !important;
        padding: 12px 16px 10px 16px !important;
        overflow-y: auto !important;
        background: #ffffff !important;
        display: flex !important;
        flex-direction: column !important;
      }
      .modal-text {
        font-size: 12px !important;
        line-height: 1.45 !important;
        margin: 0 0 8px 0 !important;
        color: #303642 !important;
      }
      .modal-footer {
        padding-top: 8px !important;
        min-height: 30px !important;
        flex-shrink: 0 !important;
      }
      .modal-footer span {
        font-size: 9px !important;
      }
      .post-link-btn {
        font-size: 9px !important;
        padding: 4px 7px !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- CABECERA -->
    <div class="header-card">
      <div class="header-titles">
        <h2>
          Portal Oficial
          <span>Rayostats</span>
        </h2>
        <p class="subtitle">
          Análisis táctico y rendimiento del Rayo Vallecano con Big Data
        </p>
      </div>
      <div class="search-box">
        <input
          type="text"
          id="termino"
          placeholder="Buscar rival, jugador o métrica..."
        >
        <button onclick="ejecutarBusqueda()">
          Buscar
        </button>
      </div>
    </div>
    <!-- NOTICIAS -->
    <div id="portal-noticias"></div>

    <!-- WIDGET SCOREAXIS ABAJO DEL TODO -->

      <div class="col-titulo" style="margin-top: 0;">Top Jugadores</div>

      </div>
    </div>
  </div>
  <!-- MODAL -->
  <div
    class="modal-overlay"
    id="popup-modal"
    onclick="cerrarPopup(event)"
  >
    <div class="modal-box" id="modal-box">
      <button class="modal-close-btn" onclick="forzarCierrePopup()">
        ✕
      </button>
      <div class="modal-img-container" id="modal-imagen-slot"></div>
      <div class="modal-body-content">
        <div class="modal-text" id="modal-texto-slot"></div>
        <div class="modal-footer">
          <span style="font-size: 11px; font-weight: bold; color: var(--color-rayo);">
            ⚡ Rayostats Premium
          </span>
          <a class="post-link-btn" id="modal-link-slot" href="#" target="_blank">
            Instagram ↗
          </a>
        </div>
      </div>
    </div>
  </div>
  <!-- JAVASCRIPT -->
  <script>
    var bancoDeDatosGlobal = [];
    var imagenesCarruselActual = [];
    var indiceImagenActual = 0;
    window.onload = function() {
      cargarPortadaInicial();
    };
    document.addEventListener('DOMContentLoaded', function() {
      var inputTermino = document.getElementById('termino');
      if (inputTermino) {
        inputTermino.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            ejecutarBusqueda();
          }
        });
      }
    });
    function cargarPortadaInicial() {
      var contenedor = document.getElementById('portal-noticias');
      contenedor.innerHTML =
        '<p style="text-align:center;color:var(--text-muted);padding:40px;font-family:Verdana;">' +
        'Cargando rotativa táctica...' +
        '</p>';
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(mostrarResultados)
          .buscarPublicacion("");
      }
    }
    function ejecutarBusqueda() {
      var termino = document.getElementById('termino').value;
      if (!termino.trim()) {
        cargarPortadaInicial();
        return;
      }
      var contenedor = document.getElementById('portal-noticias');
      contenedor.innerHTML =
        '<p style="text-align:center;color:var(--text-muted);padding:40px;font-family:Verdana;">' +
        'Filtrando base de datos...' +
        '</p>';
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(mostrarResultados)
          .buscarPublicacion(termino);
      }
    }
    function mostrarResultados(resultados) {
      var contenedor = document.getElementById('portal-noticias');
      contenedor.innerHTML = '';
      bancoDeDatosGlobal = resultados || [];
      if (!resultados || resultados.length === 0) {
        contenedor.innerHTML =
          '<p style="text-align:center;color:var(--text-muted);background:var(--bg-card);padding:30px;border-radius:12px;font-family:Verdana;">' +
          'No se encontraron registros tácticos.' +
          '</p>';
        return;
      }
      var htmlSuperior = '<div class="seccion-titulares">';
      var p1 = resultados[0];
      var img1Html = (p1.foto && p1.foto !== "NO_IMAGE")
        ? '<img src="' + p1.foto + '" fetchpriority="high" decoding="async">'
        : '<div class="placeholder-premium" style="width:100%;aspect-ratio:1080/1350;"><div>📊</div></div>';
      var titularP1 = p1.titular ? p1.titular : p1.texto;
      var subtituloP1 = (p1.subtitulo && p1.subtitulo !== p1.titular) ? p1.subtitulo : '';
      htmlSuperior +=
        '<div class="post-gran-portada" onclick="abrirPopup(0)">' +
          '<div class="bg-image-wrapper">' + img1Html + '</div>' +
          '<div class="post-content">' +
            '<div>' +
              '<h1><span class="badge-live">Últimos datos</span>' + titularP1 + '</h1>' +
              (subtituloP1 ? '<p style="font-size:13px; color:var(--text-muted); margin:-8px 0 15px 0; font-family:Verdana;">' + subtituloP1 + '</p>' : '') +
            '</div>' +
            '<button class="post-link-btn" style="cursor:pointer;">Leer Análisis Completo</button>' +
          '</div>' +
        '</div>';
      htmlSuperior += '<div class="columna-titulares-secundarios">';
      for (var i = 1; i <= 2; i++) {
        if (resultados[i]) {
          var pSec = resultados[i];
          var imgSecHtml = (pSec.foto && pSec.foto !== "NO_IMAGE")
            ? '<img class="img-side" src="' + pSec.foto + '" fetchpriority="high" decoding="async">'
            : '<div class="placeholder-premium" style="width:100%;aspect-ratio:1080/1350;"><div>📊</div></div>';
          var titularSec = pSec.titular ? pSec.titular : pSec.texto;
          var subtituloSec = (pSec.subtitulo && pSec.subtitulo !== pSec.titular) ? pSec.subtitulo : '';
          htmlSuperior +=
            '<div class="tarjeta-titular-mini" onclick="abrirPopup(' + i + ')">' +
              '<div class="img-side-container">' + imgSecHtml + '</div>' +
              '<div class="content-side">' +
                '<div>' +
                  '<h3>' + titularSec + '</h3>' +
                  (subtituloSec ? '<p style="font-size:11px; color:var(--text-muted); margin:4px 0 0 0; font-family:Verdana; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">' + subtituloSec + '</p>' : '') +
                '</div>' +
                '<span class="ver-link">Ver análisis →</span>' +
              '</div>' +
            '</div>';
        }
      }
      htmlSuperior += '</div>';
      htmlSuperior +=
        '<div class="columna-widget-lateral">' +
          '<div class="widget-header-title">Clasificación LaLiga</div>' +
          '<div class="widget-iframe-container" style="position:relative; min-height:600px; width:100%;">' +
            '<div data-widget-type="entityStandings" data-entity-type="team" data-entity-id="174" data-lang="es-es" data-widget-id="276d4211-ac97-449e-b128-861181c3e803"></div>' +
          '</div>' +
          '<div id="powered-by" style="font-size:11px;font-family:Arial,sans-serif;text-align:center;margin-top:10px;color:var(--text-muted);">' +
            'Provisto por <a id="powered-by-link" href="[https://www.365scores.com/es](https://www.365scores.com/es)" target="_blank" style="color:var(--color-rayo);text-decoration:none;font-weight:bold;">365Scores.com</a>' +
          '</div>' +
        '</div>';
      htmlSuperior += '</div>';
      var htmlInferior =
        '<div>' +
          '<div class="col-titulo">Archivo de Análisis Cronológico</div>' +
          '<div class="parrilla-analisis-feed">';
      for (var j = 3; j < resultados.length; j++) {
        var pFeed = resultados[j];
        var imgFeedHtml = (pFeed.foto && pFeed.foto !== "NO_IMAGE")
          ? '<img src="' + pFeed.foto + '" loading="lazy" decoding="async">'
          : '<div class="placeholder-premium" style="width:100%;aspect-ratio:1080/1350;"><div>📊</div></div>';
        var titularFeed = pFeed.titular ? pFeed.titular : pFeed.texto;
        var subtituloFeed = (pFeed.subtitulo && pFeed.subtitulo !== pFeed.titular) ? pFeed.subtitulo : '';
        htmlInferior +=
          '<div class="card-analisis-feed" onclick="abrirPopup(' + j + ')">' +
            '<div class="img-container">' + imgFeedHtml + '</div>' +
            '<div class="content">' +
              '<div>' +
                '<h4 style="font-size:13px; font-weight:800; margin:0 0 6px 0; font-family:Verdana; color:var(--text-main); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">' + titularFeed + '</h4>' +
                (subtituloFeed ? '<p style="font-size:12px; font-weight:normal; line-height:1.4; color:var(--text-muted); margin:0 0 8px 0; font-family:Verdana; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;">' + subtituloFeed + '</p>' : '') +
              '</div>' +
              '<span class="ver-link">Ver análisis →</span>' +
            '</div>' +
          '</div>';
      }
      htmlInferior += '</div></div>';
      contenedor.innerHTML = htmlSuperior + htmlInferior;
      var scriptWidget = document.createElement('script');
      scriptWidget.src = '[https://widgets.365scores.com/main.js](https://widgets.365scores.com/main.js)';
      scriptWidget.async = true;
      document.body.appendChild(scriptWidget);
    }
    function abrirPopup(indice) {
      var post = bancoDeDatosGlobal[indice];
      if (!post) return;
      var slotTexto = document.getElementById('modal-texto-slot');
      var slotLink = document.getElementById('modal-link-slot');
      imagenesCarruselActual = (post.fotos && post.fotos.length > 0)
        ? post.fotos
        : (post.foto && post.foto !== "NO_IMAGE") ? [post.foto] : [];
      indiceImagenActual = 0;
      construirEstructuraCarrusel();
      slotTexto.innerText = post.texto;
      slotLink.href = post.url;
      document.getElementById('popup-modal').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }
    function construirEstructuraCarrusel() {
      var slotImagen = document.getElementById('modal-imagen-slot');
      if (imagenesCarruselActual.length === 0) {
        slotImagen.innerHTML = '<div class="placeholder-premium" style="width:100%;height:100%;background:#ffffff;"><div style="font-size:32px;">📊</div></div>';
        return;
      }
      var html = '<div class="slider-track" id="slider-track">';
      for (var i = 0; i < imagenesCarruselActual.length; i++) {
        html += '<div class="slide-item"><img src="' + imagenesCarruselActual[i] + '" decoding="async"></div>';
      }
      html += '</div>';
      if (imagenesCarruselActual.length > 1) {
        html += '<button class="carrusel-btn prev" onclick="cambiarImagen(-1)">❮</button>';
        html += '<button class="carrusel-btn next" onclick="cambiarImagen(1)">❯</button>';
        html += '<div class="carrusel-indicadores">';
        for (var k = 0; k < imagenesCarruselActual.length; k++) {
          var claseActiva = (k === 0) ? 'activo' : '';
          html += '<div class="indicador-dot ' + claseActiva + '" id="dot-' + k + '"></div>';
        }
        html += '</div>';
      }
      slotImagen.innerHTML = html;
      actualizarDesplazamientoSlide();
    }
    function cambiarImagen(direccion) {
      indiceImagenActual += direccion;
      if (indiceImagenActual < 0) {
        indiceImagenActual = imagenesCarruselActual.length - 1;
      } else if (indiceImagenActual >= imagenesCarruselActual.length) {
        indiceImagenActual = 0;
      }
      actualizarDesplazamientoSlide();
    }
    function actualizarDesplazamientoSlide() {
      var track = document.getElementById('slider-track');
      if (track) {
        track.style.transform = 'translateX(-' + (indiceImagenActual * 100) + '%)';
      }
      for (var i = 0; i < imagenesCarruselActual.length; i++) {
        var dot = document.getElementById('dot-' + i);
        if (dot) {
          if (i === indiceImagenActual) {
            dot.classList.add('activo');
          } else {
            dot.classList.remove('activo');
          }
        }
      }
    }
    function cerrarPopup(event) {
      if (event.target.id === 'popup-modal') {
        forzarCierrePopup();
      }
    }
    function forzarCierrePopup() {
      document.getElementById('popup-modal').style.display = 'none';
      document.body.style.overflow = 'auto';
    }
  </script>
</body>
</html>
